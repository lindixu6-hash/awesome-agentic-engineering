name: Attested Release Artifacts

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Verify release identity
        env:
          RELEASE_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          package_version="$(node -p 'require("./package.json").version')"
          expected_ref="refs/tags/v${package_version}"
          if [ "$EVENT_NAME" = "push" ] && [ "$RELEASE_REF" != "$expected_ref" ]; then
            echo "Tag $RELEASE_REF does not match package version v$package_version." >&2
            exit 1
          fi

      - name: Test package contract
        run: npm test

      - name: Build exact npm tarball and SBOM
        run: |
          mkdir -p release
          npm pack --ignore-scripts --pack-destination release
          npm sbom --sbom-format=cyclonedx > release/awesome-agentic-engineering.cdx.json
          (
            cd release
            sha256sum ./*.tgz ./*.json > SHA256SUMS
            sha256sum --check SHA256SUMS
          )
          test "$(find release -maxdepth 1 -name '*.tgz' | wc -l)" = "1"

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: |
            release/*.tgz
            release/awesome-agentic-engineering.cdx.json
            release/SHA256SUMS

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts-${{ github.sha }}
          path: release
          if-no-files-found: error
          retention-days: 90

  publish:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download attested workflow artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts-${{ github.sha }}
          path: release

      - name: Publish durable release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" \
            release/*.tgz \
            release/awesome-agentic-engineering.cdx.json \
            release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Verify durable release download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir release-download
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-download
          (
            cd release-download
            sha256sum --check SHA256SUMS
          )
          for source in \
            release/*.tgz \
            release/awesome-agentic-engineering.cdx.json \
            release/SHA256SUMS; do
            file="${source#release/}"
            cmp "$source" "release-download/$file"
          done
