name: Star Watch

on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Restore previous snapshot
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .star-watch.json
          key: star-watch-${{ github.run_id }}
          restore-keys: |
            star-watch-

      - name: Check repository growth
        run: |
          node bin/star-watch.js "${{ github.repository }}" \
            --state .star-watch.json \
            --target 1000 \
            --text | tee star-watch.txt

          {
            echo "## Daily Star Watch"
            echo
            echo '```text'
            cat star-watch.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save current snapshot
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .star-watch.json
          key: star-watch-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload snapshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: star-watch-${{ github.run_id }}
          include-hidden-files: true
          path: |
            .star-watch.json
            star-watch.txt
